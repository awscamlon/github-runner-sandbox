name: Vadidate PET Merge

on:
  # Trigger this workflow when the pull request targets the PET branch.
  pull_request_target: # Runs in the context of the base repository (the repository where the pull request is being merged into).
    branches: [pet]
    
jobs:
  check-source-branch:
    runs-on: self-hosted
    steps:
      - name: Check if PR is from NonProd
        env:
          # HEAD_REF: This environment variable contains the name of the source branch (the branch from which the pull request is created).
          HEAD_REF: ${{ github.head_ref }} 
        run: |
          if [ "$HEAD_REF" != "nonprod" ]; then
            echo "PRs to PET must come from NonProd branch only!"
            exit 1
          fi
